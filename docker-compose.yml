services:
  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: lampdb
      MARIADB_USER: lampuser
      MARIADB_PASSWORD: lamppassword
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: